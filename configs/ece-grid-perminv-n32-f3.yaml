seed: 42
datapath: dataset
val_split: 0.1
n_constituents: 32
pt_eta_phi: true
model_class: gnn_uq1

save_path: trust_models/ece-grid-perminv/f3/n32
model:
  init_bw_a: 7
  init_bw_k: 7
  k_bw_l1_reg: 1.e-8
  a_bw_l1_reg: 1.e-8
train:
  init_weights: "official_models/3-feature-perminv/jet_classifier_large_32/ckpts/epoch=1390-acc=79.13%-val_acc=78.92%-EBOPs=176950.keras"
  lr: 0
  bsz: 2790
  epochs: 100
  early_stopping:
    enabled: true
    monitor: val_loss
    mode: min
    patience: 15
    min_delta: 1.e-4
    restore_best_weights: false
  cdr_args:
    initial_learning_rate: 3.e-5
    first_decay_steps: 100
    t_mul: 1.0
    m_mul: 1.0
    alpha: 1.e-6
    alpha_steps: 10
trust:
  enabled: true
  ece_bins: 15
  ece_weight: 2.0
  pareto_min_accuracy: 0.7842
beta:
  intervals:
    - [0, 0.0, constant]
    - ["${train.epochs}", 0.0, constant]
